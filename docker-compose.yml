version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: classpro-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "243:243"
    volumes:
      - ./frontend/.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:243/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s